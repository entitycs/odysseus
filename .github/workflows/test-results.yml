name: Update Test Summary

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405

        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        id: pytest
        run: |
          python -m pytest -q | tee pytest_output.txt

      - name: Extract summary line
        id: summary
        run: |
          SUMMARY=$(grep -E "failed|passed|skipped|warnings" pytest_output.txt | tail -n 1)
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Update CONTRIBUTING.md
        run: |
          SUMMARY="${{ steps.summary.outputs.summary }}"
          sed -i "s|<!--TEST_SUMMARY-->.*<!--END_TEST_SUMMARY-->|<!--TEST_SUMMARY-->${SUMMARY}<!--END_TEST_SUMMARY-->|" CONTRIBUTING.md

      - name: Generate badge
        run: |
          SUMMARY="${{ steps.summary.outputs.summary }}"
          echo "<svg xmlns='http://www.w3.org/2000/svg' width='300' height='20'>
            <rect width='300' height='20' fill='#555'/>
            <rect x='80' width='220' height='20' fill='#4c1'/>
            <text x='10' y='14' fill='#fff' font-family='Verdana' font-size='11'>tests</text>
            <text x='90' y='14' fill='#fff' font-family='Verdana' font-size='11'>${SUMMARY}</text>
          </svg>" > tests-badge.svg

      - name: Commit changes
        if: github.ref == 'refs/heads/dev'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CONTRIBUTING.md tests-badge.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update test summary"

            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            git push
          else
            echo "No changes to commit"
          fi
